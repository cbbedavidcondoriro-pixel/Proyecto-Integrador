<div class="login-mobile-container">
  
  <div class="logo-section">
    <div class="pulse-icon">💊</div>
    <h2>SmartMediIoT</h2>
    <p>Portal de Monitoreo para Pacientes</p>
  </div>

  <div class="login-card">
    <h3>Iniciar Sesión IoT</h3>
    <p class="subtitle">Introduce las credenciales asignadas a tu pastillero</p>

    <form (ngSubmit)="iniciarSesion()">
      
      <div class="form-group">
        <label>👤 Nombre de Usuario</label>
        <input type="text" [(ngModel)]="usuario" name="usuario" placeholder="Ej. david123" class="input-mobile">
      </div>

      <div class="form-group">
        <label>🔐 Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" class="input-mobile">
      </div>

      <button type="submit" class="btn-submit-mobile" [disabled]="cargando">
        {{ cargando ? 'Sincronizando...' : 'Conectar con mi Pastillero' }}
      </button>

    </form>
  </div>

  <div *ngIf="cargando" class="loading-overlay">
    <div class="spinner"></div>
    <p>Sincronizando con la red médica...</p>
  </div>

  <p class="help-footer">¿No tienes cuenta? Solicita tu acceso en el área de farmacia de la clínica.</p>
</div>
