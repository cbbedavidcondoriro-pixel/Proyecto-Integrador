<div class="login-mobile-container">
  
  <header class="logo-section">
    <div class="pulse-icon-container">
      <span class="pulse-ring"></span>
      <div class="main-icon">🧬</div>
    </div>
    <h2>Bienvenido</h2>
    <p>PortalPacientes</p>
  </header>

  <div class="login-card">
    <h3>Login Paciente</h3>
    <p class="subtitle">Ingrese las credenciales correctas</p>

    <div>
      
      <div class="form-group">
        <label for="input-user">👤 NOMBRE DE USUARIO</label>
        <input 
          id="input-user"
          type="text" 
          [(ngModel)]="usuario" 
          name="usuario" 
          placeholder="Ej. david" 
          class="input-mobile"
          autocomplete="username"
          required>
      </div>

      <div class="form-group">
        <label for="input-pass">🔐 CONTRASEÑA ASIGNADA</label>
        <input 
          id="input-pass"
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="••••••••" 
          class="input-mobile"
          autocomplete="current-password"
          required>
      </div>

      <button type="button" class="btn-submit-mobile" [disabled]="cargando" (click)="iniciarSesion()">
        <span *ngIf="!cargando">Ingresar al Sistema ➔</span>
        <span *ngIf="cargando">Sincronizando Canal...</span>
      </button>

    </div>
  </div>

  <div *ngIf="cargando" class="loading-overlay">
    <div class="spinner-box">
      <div class="spinner"></div>
    </div>
    <p>Estableciendo enlace seguro con la base de datos clínica...</p>
  </div>

  <footer class="help-footer">
    <p>¿No cuenta con credenciales de red local? <br>Solicite la activación en el departamento de Farmacia.</p>
  </footer>

</div>
