<div class="login-container">
    <video autoplay muted loop playsinline class="background-video">
        <source src="Vídeo de    www.kaboompics.com de Pexels: https://www.pexels.com/es-es/video/mujer-ordenador-portatil-internet-tecnologia-7195708/">
        Tu navegador no soporta videos de fondo.
    </video>

    <div class="overlay"></div>

    <div class="login-card">
        <div class="left">
            <h1>SmartMediIoT</h1>
            <p>
                Plataforma inteligente para administración médica,
                monitoreo de pacientes y tratamientos automatizados.
            </p>
        </div>

        <div class="right">
            <h2>Iniciar Sesión</h2>

            <form (ngSubmit)="login()">
                <div class="input-group">
                    <label>Usuario</label>
                    <input
                        type="text"
                        name="usuario"
                        [(ngModel)]="usuario.usuario"
                        placeholder="Ingrese su usuario"
                        required>
                </div>

                <div class="input-group">
                    <label>Contraseña</label>
                    <div class="password-wrapper">
                        <input
                            [type]="mostrarPassword ? 'text' : 'password'"
                            name="password"
                            [(ngModel)]="usuario.password"
                            placeholder="Ingrese su contraseña"
                            required>
                        
                        <button type="button" class="toggle-password" (click)="mostrarPassword = !mostrarPassword">
                            <svg *ngIf="mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                            <svg *ngIf="!mostrarPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="remember">
                    <label>
                        <input type="checkbox"> Recordarme
                    </label>
                    <a href="#">¿Olvidó su contraseña?</a>
                </div>

                <button type="submit" class="btn-submit">Ingresar al Sistema</button>
            </form>

            <div class="register-link">
                ¿No tienes cuenta? <a routerLink="/register">Registrarse</a>
            </div>
        </div>
    </div>
</div>
