<main class="main-content">

    <div class="topbar">
        <div>
            <h1>Gestión de Pacientes</h1>
            <p>Administración completa de pacientes registrados en el sistema médico</p>
        </div>

        <button class="btn-add" (click)="irAListado()">
            📋 Ver Lista de Pacientes
        </button>
    </div>

    <div class="form-card">
        <h2>{{ editando ? 'Modificar Registro de Paciente' : 'Registrar Paciente' }}</h2>

        <form (submit)="$event.preventDefault()" autocomplete="off">
            <div class="grid">
                <div class="input-group">
                    <label>Nombre Completo</label>
                    <input type="text" [(ngModel)]="paciente.nombre" name="nombre" [ngModelOptions]="{standalone: true}">
                </div>

                <div class="input-group">
                    <label>Carnet de Identidad</label>
                    <input type="text" [(ngModel)]="paciente.ci" name="ci" [ngModelOptions]="{standalone: true}">
                </div>

                <div class="input-group">
                    <label>Edad</label>
                    <input type="number" [(ngModel)]="paciente.edad" name="edad" [ngModelOptions]="{standalone: true}">
                </div>

                <div class="input-group">
                    <label>Sexo</label>
                    <select [(ngModel)]="paciente.sexo" name="sexo" [ngModelOptions]="{standalone: true}">
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Teléfono</label>
                    <input type="text" [(ngModel)]="paciente.telefono" name="telefono" [ngModelOptions]="{standalone: true}">
                </div>

                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" [(ngModel)]="paciente.correo" name="correo" [ngModelOptions]="{standalone: true}">
                </div>

                <div class="input-group">
                    <label>Dirección</label>
                    <input type="text" [(ngModel)]="paciente.direccion" name="direccion" [ngModelOptions]="{standalone: true}">
                </div>

                <div class="input-group">
                    <label>Contacto Emergencia</label>
                    <input type="text" [(ngModel)]="paciente.emergencia" name="emergencia" [ngModelOptions]="{standalone: true}">
                </div>

                <div class="input-group">
                    <label>Nombre de Usuario (Login)</label>
                    <input type="text" [(ngModel)]="paciente.usuario" name="usuario" placeholder="Ej: pedro123" [ngModelOptions]="{standalone: true}">
                </div>

                <div class="input-group">
                    <label>Contraseña Acceso</label>
                    <input type="password" [(ngModel)]="paciente.password" name="password" placeholder="{{ editando ? 'Dejar vacío para no cambiar' : 'Password para el paciente' }}" [ngModelOptions]="{standalone: true}">
                </div>

                <div class="input-group full">
                    <label>Subir Fotografía del Paciente</label>
                    <input 
                        id="inputFotoElement"
                        type="file" 
                        accept="image/*"
                        (change)="cargarFotografia($event)">
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <button type="button" class="save-btn" (click)="guardarPaciente()">
                    {{ editando ? '💾 Actualizar Datos del Paciente' : '💾 Guardar Paciente' }}
                </button>
                
                <button *ngIf="editando" type="button" class="action delete" style="padding: 0 20px; border-radius: 8px;" (click)="limpiarFormulario()">
                    Cancelar Edición
                </button>
            </div>
        </form>
    </div>

</main>
