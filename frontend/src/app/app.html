<div class="app-layout-container">
    
    <aside *ngIf="isLoggedIn" class="sidebar no-print">
        <div class="sidebar-top">
            <div class="logo">
                🏥 SmartMediIoT
            </div>

            <ul class="menu">
                <li routerLink="/dashboard" routerLinkActive="active">
                    <span class="menu-icon">📊</span> Dashboard
                </li>
                <li routerLink="/patients" routerLinkActive="active">
                    <span class="menu-icon">👨‍⚕️</span> Pacientes
                </li>
                <li routerLink="/historial-clinico" routerLinkActive="active">
                    <span class="menu-icon">📝</span> Historial Clínico
                </li>
                <li routerLink="/treatments" routerLinkActive="active">
                    <span class="menu-icon">💊</span> Tratamientos
                </li>
                <li routerLink="/reportes" routerLinkActive="active">
                    <span class="menu-icon">🧾</span> Reportes
                </li>
                <li routerLink="/consultas" routerLinkActive="active">
                    <span class="menu-icon">🔍</span> Consultas Clínicas
                </li>
                <li routerLink="/configuracion" routerLinkActive="active">
                    <span class="menu-icon">⚙️</span> Configuración
                </li>
            </ul>
        </div>

        <div class="logout-box" (click)="logout()">
            <span class="menu-icon">🚪</span> Cerrar Sesión
        </div>
    </aside>

    <main class="main-content-layout" [style.margin-left]="isLoggedIn ? '260px' : '0px'" [style.width]="isLoggedIn ? 'calc(100% - 260px)' : '100%'">
        <router-outlet></router-outlet>
    </main>

</div>
